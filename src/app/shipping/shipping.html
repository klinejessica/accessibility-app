<form>
    <fieldset id="shipping">
        <legend>Shipping Address</legend>
        <div>
            <label for="name1">Name: </label>
            <input id="name1" name="name1" type="text" required />
        </div>
        <div>
            <label for="address1">Address: </label>
            <input id="address1" name="address1" type="text" required />
        </div>
        <div>
            <label for="zip-code1">Zip/Postal Code: </label>
            <input id="zip-code1" name="zip-code1" type="text" required />
        </div>
    </fieldset>
    <fieldset id="billing">
        <legend>Billing Address</legend>
        <div>
            <label for="billing-checkbox">Same as shipping address:</label>
            <input type="checkbox" id="billing-checkbox" checked />
        </div>
        <div>
            <label for="name" class="billing-label disabled-label">Name: </label>
            <input id="name" name="name" type="text" disabled requried />
        </div>
        <div>
            <label for="address2" class="billing-label disabled-label">Address: </label>
            <input id="address2" name="address2" type="text" disabled required />
        </div>
        <div>
            <label for="zip-code2" class="billing-label disabled-label">Zip/Postal Code: </label>
            <input id="zip-code2" name="zip-code2" type="text" disabled required />
        </div>
    </fieldset>
    <hr>
    <fieldset>
        <legend>Check Shipping Details</legend>
        <div>
            <label for="sname">Name: </label>
            <input id="sname" name="sname" value="Mr. Soft" readonly />
        </div>
        <div>
            <label for="saddress">Address: </label>
            <textarea id="saddress" name="sadress" readonly>
                23 Elastic Way,
                Vicious,
                Brightrigdge,
                CA
            </textarea>
        </div>
        <div>
            <label for="szip-code">Zip Code: </label>
            <input id="szip-code" name="szip-code" type="text" value="94708" readonly />
        </div>
    </fieldset>

    <fieldset>
        <legend>Final Instructions</legend>
        <div>
            <label for="sms-confirm">Send confirmation via sms?</label>
            <input id="sms-confirm" name="sms-confirm" type="checkbox" />
        </div>
        <div>
            <label for="instructions">Any special instructions?</label>
            <textarea id="instructions" name="instructions"></textarea>
        </div>
    </fieldset>

    <div><button>Ammend Details</button></div>
</form>
